[package]
name = "zellij-vertical-tabs"
version = "0.1.0"
edition = "2024"
description = "A vertical tab bar plugin for zellij"
license = "MIT"

[profile.release]
# Match zjstatus's proven working build configuration exactly.
# panic=abort is critical: WASI does not support stack unwinding, so without
# this any panic causes undefined WASM behavior instead of a clean abort.
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
zellij-tile = "0.43.1"
unicode-width = "0.1"
